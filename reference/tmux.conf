# Reference: the tmux config this mapping was derived from.
# Kept verbatim so every claim in the README can be checked against a
# real config rather than an idealised one. Prefix is ctrl+s, not ctrl+b.

##############################################################################
# Some NOTEs:
#
# - Every keybinding lives in a key table. There are three built-in key tables:
#
#   1. prefix: Keys in this table must be pressed after the prefix Ctrl + b to
#   trigger the binding. This is the table that the bind command uses by
#   default. Example: bind C-t new-window;
#   2. root: Keys in this table can just be pressed, without any prefix. Use -n
#   (a shortcut for -T root) to bind keys in this table. Example: bind -n C-t
#   new-window;
#   3. copy-mode or copy-mode-vi for when in copy mode, depending on whether
#   you're using emacs- or vi-style key bindings mode (add set-window-option -g
#   mode-keys vi to your ~/.tmux.conf file to force vi-style). Use -T
#   copy-mode-vi to bind keys in this table. Example: bind -T copy-mode-vi C-t
#   new-window;
##############################################################################


###############################################################################
# Options & Key Bindings
###############################################################################
# Add to '/etc/shells'
# set-option -g default-shell /usr/local/bin/zsh

# History buffer size
set-option -g history-limit 100000
set-option -g set-titles on
set-hook -g after-split-window 'selectp -T ""'
set-hook -g after-new-window 'selectp -T ""'
set-hook -g after-new-session 'selectp -T ""'
# Status update interval
set -g status-interval 10
# Allows for faster key repetition
set -s escape-time 10
set -g repeat-time 500
set -g mouse on 

# Prefix (VIM use CTRL-b)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Clear current buffer history
unbind K
# bind -n C-k send-keys -R \; send-keys C-l \; clear-history
bind C-l send-keys -R \; send-keys C-l \; clear-history

# Fast reload conf
bind r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

# Sessions
bind C-c new-session

# bind C-f command-prompt -p find-session 'switch-client -t %%'
bind C-n switch-client -n
bind C-p switch-client -p

# <prefix> + C-s Return to last session
bind-key C-a last-window
bind C-s switch-client -l

# fzf pane/window picker across all sessions
bind C-f display-popup -w 92% -h 72% -E "~/.config/tmux/scripts/tmux-fzf-window.sh"


# Windows
# Auto window rename
set -g automatic-rename on
set -g renumber-windows on

# Set window split
bind c new-window -c "#{pane_current_path}"
bind b split-window -c "#{pane_current_path}"

# Bind '<prefix> + b' to split pane and SSH if on remote host
# bind b if -F '#{!=:#{pane_host},#{host}}' \
#     'split-window -c "#{pane_current_path}" "ssh #{pane_host}"' \
#     'split-window -c "#{pane_current_path}"'

bind v split-window -h -c "#{pane_current_path}"
# Swap window for tmux -V > 3.0
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Panes
# Slect Pane by <prefix>hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# Resize pane
bind C-k resize-pane -U 5
bind C-j resize-pane -D 5
# For split vertically usually not useful here
# bind C-h resize-pane -L 10
# bind C-l resize-pane -R 10
bind L swap-pane -D
bind H swap-pane -U

# Focus / dense-pane layouts
bind z resize-pane -Z
bind m select-layout main-vertical
bind M select-layout main-horizontal
bind = select-layout tiled
bind q display-panes

# bind-key tab select-pane -t :.+
bind-key * set-window-option synchronize-pane
set -g display-panes-time 1500
setw -g main-pane-width "67%"
setw -g main-pane-height "70%"

# Copy vi mode
# NOTE: macOS pbcopy to sys clipboard
set-window-option -g mode-keys vi
# bind-key -n y copy
bind-key -T copy-mode-vi v                    send-keys -X begin-selection
bind-key -T copy-mode-vi C-v                  send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y                    send-keys -X copy-pipe "pbcopy"

# Enhanced search bindings
# Backward search (prefix + /)
bind-key / copy-mode \; command-prompt -i -p "(reverse-i-search)" "send -X search-backward-incremental \"%%%\""
# Forward search (prefix + ?)
bind-key ? copy-mode \; command-prompt -i -p "(forward-i-search)" "send -X search-forward-incremental \"%%%\""

# Additional search-related bindings in copy-mode-vi
bind-key -T copy-mode-vi / command-prompt -i -p "/" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "?" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

# Activity
set -g monitor-activity on
set -g visual-activity off

set -g base-index 1
setw -g pane-base-index 1

###############################################################################
# Style & Color Themes
###############################################################################
GRAY="#808080"
BLUE="#569CD6"
DARK_BLUE="#223E55"
RED="#EE4646"
YELLOW="#CCCC99"
BACKGROUND="#000000"
FOREGROUND="#CCCCCC"

set -g pane-border-status top
set -g pane-border-format " #{?pane_active,>, }#P #{pane_current_command} #{b:pane_current_path}#{?#{==:#{pane_title},}, , [#{pane_title}] }#{?window_zoomed_flag,[Z] ,}"

set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour220
set -g pane-border-indicators both

# set -g status-style bg=$BACKGROUND,fg=$BLUE
# set -g pane-border-style fg=$DARK_BLUEu
# set -g pane-active-border-style fg=$BLUE
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g status-left-length 60
set -g status-left "#[bg=colour239] #[fg=colour185]#S|#I/#{session_windows}#P/#{window_panes}|#[bg=colour236]#[bg=colour237]#[bg=colour72]"

# Window status
set -g window-status-format '#[bg=colour238]#[fg=colour243] #I:[#W]#(pwd="#{pane_current_path}"; echo ${pwd####*/})#[fg=colour111]#[bg=colour240]#F#[bg=colour238] '
set -g window-status-current-format '#[bg=colour236]#[fg=colour255]#[fg=colour185]>#I:[#W]#[fg=colour254]#(pwd="#{pane_current_path}"; echo ${pwd#*/})#F#[bg=colour238] '


# set-option -g status-justify left
set-option -g status-bg colour239
set-option -g status-right '#[bg=colour236] #[bg=colour235]#[fg=colour185] #(date "+%a %b %d %H:%M") #[bg=colour236] #[bg=colour237]'

#set -g status-right '#[fg=cyan,bold] #U@#H #[default]#[fg=blue]#(tmux display-message -p "#{pane_current_path}" | gsed "s#$HOME#~#g") #[fg=red]%H:%M %d-%b-%y#[default]'


###############################################################################
# TPM: Tmux Plug Manager
###############################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'lroolle/tmux-continuum'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'fcsonline/tmux-thumbs'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-save-command-strategy 'pgrep'

set -g @continuum-save-interval '30'
set -g @continuum-restore 'on'
set -g @continuum-status-on 'on'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'

set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-multi-command 'echo -n {} | pbcopy'
set -g @thumbs-key f
set -g @thumbs-unique enabled
set -g @thumbs-regexp-1 '[a-z]+@[a-z]+.com' # Match emails
set -g @thumbs-regexp-2 '[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:[a-f0-9]{2}:' # Match MAC addresses
set -g @thumbs-regexp-3 '\*\s+(v\d+\.\d+\.\d+)' # fnm list, * v1.2.3

# NOTE: no manual run-shell for plugin entry points. TPM sources every
# *.tmux from $TMUX_PLUGIN_MANAGER_PATH (~/.config/tmux/plugins/, XDG
# default since ~/.config/tmux/tmux.conf exists). The old
# ~/.tmux/plugins/... path is stale and returns 127.

###############################################################################
# Startup Sessions
###############################################################################
# Create default sessions on tmux server start
new-session -d -s esh

# Create work session with default path
new-session -d -s wrk -c ~/wrk/

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'

# herdr inside tmux: on every focus-in herdr queries all 256 palette colours
# (OSC 4). tmux forwards each one to Alacritty and the replies trickle back
# with gaps; herdr flushes the partial tails into the shell as ";rgb:..."
# text (herdrdev/herdr#4025, open). With a default pane palette tmux answers
# locally and at once. Same colours Alacritty renders; 0-15 from alacritty.toml.
source-file ~/.config/tmux/pane-colours.conf
